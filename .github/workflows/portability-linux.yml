name: Additional Linux CPUs
on:
  workflow_dispatch:
    inputs:
      arches:
        description: JSON array of CPU targets
        type: string
        required: true
        default: '["aarch64_be", "armebv7", "riscv32", "powerpc", "powerpc64", "mips", "mipsel", "mips64n32", "mips64eln32", "microblaze", "microblazeel", "or1k", "sh4", "sh4eb", "m68k", "mips64", "mips64el", "alpha", "hppa", "sparc64", "sparc", "sparc32plus", "xtensa", "hexagon", "xtensaeb"]'
permissions:
  contents: read
jobs:
  cross:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arches) }}
    env:
      RELEASE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gcc make perl xz-utils curl python3 file binutils qemu-user-static binfmt-support build-essential bison flex texinfo rsync bc cpio gawk wget unzip patch
      - name: Register the pinned QEMU user interpreters
        run: bash scripts/release-qemu.sh
      - name: Cache the source-built Xtensa SDK
        id: sdkcache
        if: matrix.arch == 'xtensaeb'
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: cross/xtensaeb-sdk.tar.gz
          key: posirc-xtensaeb-sdk-v1-${{ hashFiles('scripts/release-buildroot-sdk.sh', 'scripts/release-xtensaeb.config') }}
      - id: dependencies
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: cross/prefix/${{ matrix.arch }}
          key: posirc-cross-v1-${{ matrix.arch }}-${{ hashFiles('scripts/release-cross.sh', 'scripts/release-linux-toolchains.json') }}
      - name: Build dependencies and run complete client test suite
        run: bash scripts/release-cross.sh
      - name: Diagnose the big-endian Xtensa instruction and ABI profile
        if: failure() && matrix.arch == 'xtensaeb'
        run: |
          set +e
          compiler=$(find cross/xtensaeb/toolchain/bin -maxdepth 1 -name '*-gcc' | head -1)
          "$compiler" -dM -E -x c /dev/null > /tmp/xtensa-macros.txt
          cat /tmp/xtensa-macros.txt
          readelf -h posirc
          for cpu in fsf test_kc705_be; do
            timeout 5 cross/qemu/usr/bin/qemu-xtensaeb -cpu "$cpu" -d in_asm -D "/tmp/xtensa-$cpu.log" -strace ./posirc --version
            tail -n 100 "/tmp/xtensa-$cpu.log"
          done
          "${compiler%gcc}objdump" -d posirc > /tmp/xtensa-posirc-disassembly.txt
          true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure() && matrix.arch == 'xtensaeb'
        with:
          name: xtensa-diagnostics
          path: /tmp/xtensa-*.txt
          retention-days: 7
      - uses: actions/cache/save@3edfce9056124e459a23f683a21433670d47daca
        if: always() && matrix.arch == 'xtensaeb' && steps.sdkcache.outputs.cache-hit != 'true' && hashFiles('cross/xtensaeb-sdk.tar.gz') != ''
        with:
          path: cross/xtensaeb-sdk.tar.gz
          key: posirc-xtensaeb-sdk-v1-${{ hashFiles('scripts/release-buildroot-sdk.sh', 'scripts/release-xtensaeb.config') }}
      - uses: actions/cache/save@3edfce9056124e459a23f683a21433670d47daca
        if: always() && steps.dependencies.outputs.cache-hit != 'true' && hashFiles('cross/prefix/**/complete') != ''
        with:
          path: cross/prefix/${{ matrix.arch }}
          key: posirc-cross-v1-${{ matrix.arch }}-${{ hashFiles('scripts/release-cross.sh', 'scripts/release-linux-toolchains.json') }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: posirc-probe-linux-${{ matrix.arch }}-musl
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
