name: Beta release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested artifacts as a GitHub prerelease
        required: true
        type: boolean
        default: false
      reuse_run:
        description: Optional release run ID whose complete build/test matrix already passed
        required: false
        type: string
        default: ''
  push:
    tags: ['v*-beta.*']

permissions:
  contents: read

concurrency:
  group: beta-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    if: inputs.reuse_run == ''
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, platform: linux/amd64, runner: ubuntu-24.04, execution: native }
          - { arch: x86, platform: linux/386, runner: ubuntu-24.04, execution: x86-compatibility }
          - { arch: aarch64, platform: linux/arm64, runner: ubuntu-24.04-arm, execution: native }
          - { arch: armv7, platform: linux/arm/v7, runner: ubuntu-24.04, execution: QEMU }
          - { arch: armhf, platform: linux/arm/v6, runner: ubuntu-24.04, execution: QEMU }
          - { arch: riscv64, platform: linux/riscv64, runner: ubuntu-24.04, execution: QEMU }
          - { arch: ppc64le, platform: linux/ppc64le, runner: ubuntu-24.04, execution: QEMU }
          - { arch: s390x, platform: linux/s390x, runner: ubuntu-24.04, execution: QEMU }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: matrix.execution == 'QEMU'
      - name: Build, execute tests and package static binary
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_EXECUTION: ${{ matrix.execution }}
        run: |
          docker run --rm --platform "$RELEASE_PLATFORM" \
            -v "$PWD:/src" -w /src \
            -e GITHUB_SHA -e RELEASE_ARCH -e RELEASE_EXECUTION \
            -e RELEASE_OS=linux -e RELEASE_TARGET="linux-$RELEASE_ARCH-musl" \
            alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f \
            sh scripts/release-build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: posirc-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  macos:
    if: inputs.reuse_run == ''
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-15 }
          - { arch: x86_64, runner: macos-15-intel }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: brew install openssl@3 ncurses pkgconf
      - name: Build, execute tests and package binary
        env:
          RELEASE_OS: macos
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_TARGET: macos15-${{ matrix.arch }}
          RELEASE_EXECUTION: native
        run: sh scripts/release-build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: posirc-macos-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  bsd:
    if: inputs.reuse_run == ''
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {"os": "freebsd", "release": "14.4", "arch": "x86_64"}
          - {"os": "freebsd", "release": "14.4", "arch": "aarch64"}
          - {"os": "freebsd", "release": "14.4", "arch": "riscv64"}
          - {"os": "freebsd", "release": "14.4", "arch": "powerpc64"}
          - {"os": "openbsd", "release": "7.9", "arch": "x86_64"}
          - {"os": "openbsd", "release": "7.9", "arch": "aarch64"}
          - {"os": "openbsd", "release": "7.9", "arch": "riscv64"}
          - {"os": "openbsd", "release": "7.9", "arch": "sparc64"}
          - {"os": "netbsd", "release": "10.1", "arch": "x86_64"}
          - {"os": "netbsd", "release": "10.1", "arch": "aarch64"}
          - {"os": "netbsd", "release": "10.1", "arch": "sparc64"}
          - {"os": "netbsd", "release": "11.0", "arch": "riscv64"}
    env:
      RELEASE_OS: ${{ matrix.os }}
      RELEASE_ARCH: ${{ matrix.arch }}
      RELEASE_TARGET: ${{ matrix.os }}${{ matrix.release }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - if: matrix.os == 'freebsd'
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          sync: scp
          envs: RELEASE_OS RELEASE_ARCH RELEASE_TARGET GITHUB_SHA
          run: sh scripts/release-bsd.sh
      - if: matrix.os == 'openbsd'
        uses: vmactions/openbsd-vm@83787c3b60a6fa74abb5448c1f9aee1c83a148e0
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          sync: scp
          envs: RELEASE_OS RELEASE_ARCH RELEASE_TARGET GITHUB_SHA
          run: sh scripts/release-bsd.sh
      - if: matrix.os == 'netbsd'
        uses: vmactions/netbsd-vm@c854a06481914625f405b40f6e0b2ac5b6407b50
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          sync: scp
          envs: RELEASE_OS RELEASE_ARCH RELEASE_TARGET GITHUB_SHA
          run: sh scripts/release-bsd.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: posirc-${{ env.RELEASE_TARGET }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  unix:
    if: inputs.reuse_run == ''
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {"os": "dragonflybsd", "release": "6.4.2", "arch": "x86_64", "target": "dragonflybsd6.4.2-x86_64"}
          - {"os": "midnightbsd", "release": "4.0.8", "arch": "x86_64", "target": "midnightbsd4.0.8-x86_64"}
          - {"os": "ghostbsd", "release": "26.2", "arch": "x86_64", "target": "ghostbsd26.2-x86_64"}
          - {"os": "hardenedbsd", "release": "15", "arch": "x86_64", "target": "hardenedbsd15-x86_64"}
          - {"os": "opnsense", "release": "26.7", "arch": "x86_64", "target": "opnsense26.7-x86_64"}
          - {"os": "nextbsd", "release": "continuous", "arch": "x86_64", "target": "nextbsdcontinuous-x86_64"}
          - {"os": "nextbsd", "release": "continuous", "arch": "aarch64", "target": "nextbsdcontinuous-aarch64"}
          - {"os": "solaris", "release": "11.4-gcc-14", "arch": "x86_64", "target": "solaris11.4-gcc-14-x86_64"}
          - {"os": "omnios", "release": "r151058-build", "arch": "x86_64", "target": "omniosr151058-build-x86_64"}
          - {"os": "openindiana", "release": "202604-build", "arch": "x86_64", "target": "openindiana202604-build-x86_64"}
          - {"os": "tribblix", "release": "0m41.1", "arch": "x86_64", "target": "tribblix0m41.1-x86_64"}
          - {"os": "hurd", "release": "2025", "arch": "x86_64", "target": "hurd2025-x86_64"}
          - {"os": "hurd", "release": "2025", "arch": "i386", "target": "hurd2025-i386"}
          - {"os": "haiku", "release": "r1beta6", "arch": "x86_64", "target": "haikur1beta6-x86_64"}
          - {"os": "openeuler", "release": "24.03-LTS-SP4", "arch": "loongarch64", "target": "openeuler24.03-LTS-SP4-loongarch64"}
    env:
      RELEASE_OS: ${{ matrix.os }}
      RELEASE_ARCH: ${{ matrix.arch }}
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and test in dragonflybsd
        if: matrix.os == 'dragonflybsd'
        uses: vmactions/dragonflybsd-vm@ef89b159d5b4837913b1bb7f6450402c49891a48
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          sync: scp
          envs: RELEASE_OS RELEASE_ARCH RELEASE_TARGET GITHUB_SHA
          run: sh scripts/release-unix.sh
      - name: Build and test in midnightbsd
        if: matrix.os == 'midnightbsd'
        uses: vmactions/midnightbsd-vm@8d049010700d278253fdbfb0f91f52e7d412ac89
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          sync: scp
          envs: RELEASE_OS RELEASE_ARCH RELEASE_TARGET GITHUB_SHA
          run: sh scripts/release-unix.sh
      - name: Build and test in ghostbsd
        if: matrix.os == 'ghostbsd'
        uses: vmactions/ghostbsd-vm@eb670421808e957f982536294270c1017d468fa1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          sync: scp
          envs: RELEASE_OS RELEASE_ARCH RELEASE_TARGET GITHUB_SHA
          run: sh scripts/release-unix.sh
      - name: Build and test in hardenedbsd
        if: matrix.os == 'hardenedbsd'
        uses: vmactions/hardenedbsd-vm@f3748739801a89034c4d7147fe148bc9413b6b02
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          sync: scp
          envs: RELEASE_OS RELEASE_ARCH RELEASE_TARGET GITHUB_SHA
          run: sh scripts/release-unix.sh
      - name: Build and test in opnsense
        if: matrix.os == 'opnsense'
        uses: vmactions/opnsense-vm@c0b8dac79e53b1274c6d6cb0b1553aa87a5fa0c2
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          sync: scp
          envs: RELEASE_OS RELEASE_ARCH RELEASE_TARGET GITHUB_SHA
          run: sh scripts/release-unix.sh
      - name: Build and test in nextbsd
        if: matrix.os == 'nextbsd'
        uses: vmactions/nextbsd-vm@24825c5b4b5e99c6d16180de275955402eab5a32
        with:
          prepare: pkg lock -y pkg
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          sync: scp
          envs: RELEASE_OS RELEASE_ARCH RELEASE_TARGET GITHUB_SHA
          run: sh scripts/release-unix.sh
      - name: Build and test in solaris
        if: matrix.os == 'solaris'
        uses: vmactions/solaris-vm@214234520e38ecddf4606ecebe0e4afe34563248
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          sync: scp
          envs: RELEASE_OS RELEASE_ARCH RELEASE_TARGET GITHUB_SHA
          run: sh scripts/release-unix.sh
      - name: Build and test in omnios
        if: matrix.os == 'omnios'
        uses: vmactions/omnios-vm@76277fb0d771c7c27523b920539ab726e89ff215
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          sync: scp
          envs: RELEASE_OS RELEASE_ARCH RELEASE_TARGET GITHUB_SHA
          run: sh scripts/release-unix.sh
      - name: Build and test in openindiana
        if: matrix.os == 'openindiana'
        uses: vmactions/openindiana-vm@2ba4a6402f8310f96c3df443d203af14aa466ab2
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          sync: scp
          envs: RELEASE_OS RELEASE_ARCH RELEASE_TARGET GITHUB_SHA
          run: sh scripts/release-unix.sh
      - name: Build and test in tribblix
        if: matrix.os == 'tribblix'
        uses: vmactions/tribblix-vm@d90c5e13770ce20ec021f4d8da2bdcad48525f4a
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          sync: scp
          envs: RELEASE_OS RELEASE_ARCH RELEASE_TARGET GITHUB_SHA
          run: sh scripts/release-unix.sh
      - name: Build and test in hurd
        if: matrix.os == 'hurd'
        uses: vmactions/hurd-vm@59828763b3140b82fdcee69e71940d43539cb030
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          sync: scp
          envs: RELEASE_OS RELEASE_ARCH RELEASE_TARGET GITHUB_SHA
          run: sh scripts/release-unix.sh
      - name: Build and test in haiku
        if: matrix.os == 'haiku'
        uses: vmactions/haiku-vm@865b2c0c73d7574be04eab36e5fbe81cfb3676e9
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          sync: scp
          envs: RELEASE_OS RELEASE_ARCH RELEASE_TARGET GITHUB_SHA
          run: sh scripts/release-unix.sh
      - name: Build and test in openeuler
        if: matrix.os == 'openeuler'
        uses: vmactions/openeuler-vm@b3d69608d9cc31b06fa0bc11609515bafa860544
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          sync: scp
          envs: RELEASE_OS RELEASE_ARCH RELEASE_TARGET GITHUB_SHA
          run: sh scripts/release-unix.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: posirc-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  cross:
    if: inputs.reuse_run == ''
    name: Linux extra ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: ["aarch64_be", "armebv7", "riscv32", "powerpc", "powerpc64", "mips", "mipsel", "mips64n32", "mips64eln32", "microblaze", "microblazeel", "or1k", "sh4", "sh4eb", "m68k", "mips64", "mips64el", "alpha", "hppa", "sparc64", "sparc", "sparc32plus", "xtensa", "hexagon", "xtensaeb"]
    env:
      RELEASE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gcc make perl xz-utils curl python3 file binutils qemu-user-static binfmt-support build-essential bison flex texinfo rsync bc cpio gawk wget unzip patch
      - name: Register the pinned QEMU user interpreters
        run: bash scripts/release-qemu.sh
      - name: Cache the source-built Xtensa FSF SDK
        if: matrix.arch == 'xtensaeb'
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: cross/xtensaeb-sdk.tar.gz
          key: posirc-xtensaeb-sdk-v1-${{ hashFiles('scripts/release-buildroot-sdk.sh', 'scripts/release-xtensaeb.config') }}
      - id: dependencies
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: cross/prefix/${{ matrix.arch }}
          key: posirc-cross-v1-${{ matrix.arch }}-${{ hashFiles('scripts/release-cross.sh', 'scripts/release-linux-toolchains.json') }}
      - name: Build dependencies and run complete client test suite
        run: bash scripts/release-cross.sh
      - uses: actions/cache/save@3edfce9056124e459a23f683a21433670d47daca
        if: always() && steps.dependencies.outputs.cache-hit != 'true' && hashFiles('cross/prefix/**/complete') != ''
        with:
          path: cross/prefix/${{ matrix.arch }}
          key: posirc-cross-v1-${{ matrix.arch }}-${{ hashFiles('scripts/release-cross.sh', 'scripts/release-linux-toolchains.json') }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: posirc-linux-extra-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  verify:
    name: Verify complete artifacts
    needs: [linux, macos, bsd, unix, cross]
    if: >-
      !cancelled() && inputs.reuse_run == '' &&
      needs.linux.result == 'success' && needs.macos.result == 'success' &&
      needs.bsd.result == 'success' && needs.unix.result == 'success' &&
      needs.cross.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: posirc-*
          merge-multiple: true
          path: dist
      - name: Verify every target, source revision and archive contents
        run: python3 scripts/release-verify.py assets dist "$GITHUB_SHA"

  publish:
    name: Publish complete beta
    needs: [verify]
    if: >-
      !cancelled() && (startsWith(github.ref, 'refs/tags/') || inputs.publish) &&
      (inputs.reuse_run != '' || needs.verify.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Select and verify tested source revision
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REUSE_RUN: ${{ inputs.reuse_run }}
        run: |
          set -euo pipefail
          source_sha="$GITHUB_SHA"
          run_id="$GITHUB_RUN_ID"
          if [ -n "$REUSE_RUN" ]; then
            [[ "$REUSE_RUN" =~ ^[0-9]+$ ]]
            run_id="$REUSE_RUN"
            gh api "repos/$GH_REPO/actions/runs/$run_id" > run.json
            jq -e --arg repo "$GH_REPO" '
              .head_repository.full_name == $repo and
              .path == ".github/workflows/release.yml" and
              (.event == "workflow_dispatch" or .event == "push") and
              .status == "completed"' run.json
            gh api "repos/$GH_REPO/actions/runs/$run_id/jobs?per_page=100" > jobs.json
            source_sha=$(jq -r .head_sha run.json)
            gh api "repos/$GH_REPO/contents/scripts/release-targets.json?ref=$source_sha" \
              --jq .content | base64 --decode > targets.json
            python3 - <<'PYVERIFY'
          import json
          expected = {r['job'] for r in json.load(open('targets.json'))}
          expected.add('Verify complete artifacts')
          jobs = [j for j in json.load(open('jobs.json'))['jobs'] if j['name'] != 'Publish complete beta']
          assert len(jobs) == len(expected), 'Incomplete build matrix'
          assert {j['name'] for j in jobs} == expected, 'Unexpected build jobs'
          assert all(j['status'] == 'completed' and j['conclusion'] == 'success' for j in jobs), 'Build/test failure'
          PYVERIFY
            source_sha=$(jq -r .head_sha run.json)
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          pattern: posirc-*
          merge-multiple: true
          path: dist
      - name: Validate assets, create source archive and publish prerelease
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^#define POSIRC_VERSION "\([^"]*\)"/\1/p' include/app.h)
          tag="v$version"
          case "$version" in *-beta.[0-9]*) ;; *) exit 1 ;; esac
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "$tag"; fi
          python3 scripts/release-verify.py assets dist "$SOURCE_SHA"
          git archive --format=tar.gz --prefix="posirc-$version/" \
            -o "dist/posirc-$version-source.tar.gz" "$SOURCE_SHA"
          bash scripts/release-sourcekit.sh
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          test -f "docs/releases/$tag.md"
          target_args=(--target "$SOURCE_SHA")
          if existing=$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha 2>/dev/null); then
            test "$existing" = "$SOURCE_SHA"
            target_args=(--verify-tag)
          fi
          # Upload as a draft first; only a complete asset set becomes public.
          gh release create "$tag" dist/*.tar.gz dist/SHA256SUMS \
            "${target_args[@]}" --title "POSIRC $version" \
            --notes-file "docs/releases/$tag.md" --prerelease --draft
          gh release edit "$tag" --draft=false --prerelease --latest=false
