name: Beta release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested artifacts as a GitHub prerelease
        required: true
        type: boolean
        default: false
      reuse_run:
        description: Optional release run ID whose 19 build/test jobs already passed
        required: false
        type: string
        default: ''
  push:
    tags: ['v*-beta.*']

permissions:
  contents: read

concurrency:
  group: beta-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    if: inputs.reuse_run == ''
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, platform: linux/amd64, runner: ubuntu-24.04, execution: native }
          - { arch: x86, platform: linux/386, runner: ubuntu-24.04, execution: x86-compatibility }
          - { arch: aarch64, platform: linux/arm64, runner: ubuntu-24.04-arm, execution: native }
          - { arch: armv7, platform: linux/arm/v7, runner: ubuntu-24.04, execution: QEMU }
          - { arch: armhf, platform: linux/arm/v6, runner: ubuntu-24.04, execution: QEMU }
          - { arch: riscv64, platform: linux/riscv64, runner: ubuntu-24.04, execution: QEMU }
          - { arch: ppc64le, platform: linux/ppc64le, runner: ubuntu-24.04, execution: QEMU }
          - { arch: s390x, platform: linux/s390x, runner: ubuntu-24.04, execution: QEMU }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: matrix.execution == 'QEMU'
      - name: Build, execute tests and package static binary
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_EXECUTION: ${{ matrix.execution }}
        run: |
          docker run --rm --platform "$RELEASE_PLATFORM" \
            -v "$PWD:/src" -w /src \
            -e GITHUB_SHA -e RELEASE_ARCH -e RELEASE_EXECUTION \
            -e RELEASE_OS=linux -e RELEASE_TARGET="linux-$RELEASE_ARCH-musl" \
            alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f \
            sh scripts/release-build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: posirc-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  macos:
    if: inputs.reuse_run == ''
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-15 }
          - { arch: x86_64, runner: macos-15-intel }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: brew install openssl@3 ncurses pkgconf
      - name: Build, execute tests and package binary
        env:
          RELEASE_OS: macos
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_TARGET: macos15-${{ matrix.arch }}
          RELEASE_EXECUTION: native
        run: sh scripts/release-build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: posirc-macos-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  freebsd:
    if: inputs.reuse_run == ''
    name: FreeBSD ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64, riscv64, powerpc64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and test in FreeBSD VM
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1
        env:
          RELEASE_OS: freebsd
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_TARGET: freebsd14.4-${{ matrix.arch }}
        with:
          release: '14.4'
          arch: ${{ matrix.arch }}
          sync: scp
          envs: RELEASE_OS RELEASE_ARCH RELEASE_TARGET
          run: sh scripts/release-bsd.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: posirc-freebsd-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  openbsd:
    if: inputs.reuse_run == ''
    name: OpenBSD ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and test in OpenBSD VM
        uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3 # v1
        env:
          RELEASE_OS: openbsd
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_TARGET: openbsd7.9-${{ matrix.arch }}
        with:
          release: '7.9'
          arch: ${{ matrix.arch }}
          sync: scp
          envs: RELEASE_OS RELEASE_ARCH RELEASE_TARGET
          run: sh scripts/release-bsd.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: posirc-openbsd-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  netbsd:
    if: inputs.reuse_run == ''
    name: NetBSD ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64, sparc64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and test in NetBSD VM
        uses: vmactions/netbsd-vm@c8a0d7ddb84619a7a8cc4e652efa7950b3fd9f92 # v1
        env:
          RELEASE_OS: netbsd
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_TARGET: netbsd10.1-${{ matrix.arch }}
        with:
          release: '10.1'
          arch: ${{ matrix.arch }}
          sync: scp
          envs: RELEASE_OS RELEASE_ARCH RELEASE_TARGET
          run: sh scripts/release-bsd.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: posirc-netbsd-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish complete beta
    needs: [linux, macos, freebsd, openbsd, netbsd]
    if: >-
      !cancelled() && (startsWith(github.ref, 'refs/tags/') || inputs.publish) &&
      (inputs.reuse_run != '' || (needs.linux.result == 'success' &&
      needs.macos.result == 'success' && needs.freebsd.result == 'success' &&
      needs.openbsd.result == 'success' && needs.netbsd.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Select and verify tested source revision
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REUSE_RUN: ${{ inputs.reuse_run }}
        run: |
          set -euo pipefail
          source_sha="$GITHUB_SHA"
          run_id="$GITHUB_RUN_ID"
          if [ -n "$REUSE_RUN" ]; then
            [[ "$REUSE_RUN" =~ ^[0-9]+$ ]]
            run_id="$REUSE_RUN"
            gh api "repos/$GH_REPO/actions/runs/$run_id" > run.json
            jq -e --arg repo "$GH_REPO" '
              .head_repository.full_name == $repo and
              .path == ".github/workflows/release.yml" and
              (.event == "workflow_dispatch" or .event == "push") and
              .status == "completed"' run.json
            gh api "repos/$GH_REPO/actions/runs/$run_id/jobs?per_page=100" > jobs.json
            jq -e '[.jobs[] | select(.name != "Publish complete beta")] |
              length == 19 and all(.status == "completed" and .conclusion == "success")' jobs.json
            source_sha=$(jq -r .head_sha run.json)
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          pattern: posirc-*
          merge-multiple: true
          path: dist
      - name: Validate assets, create source archive and publish prerelease
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^#define POSIRC_VERSION "\([^"]*\)"/\1/p' include/app.h)
          tag="v$version"
          case "$version" in *-beta.[0-9]*) ;; *) exit 1 ;; esac
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "$tag"; fi
          test "$(find dist -name '*.tar.gz' | wc -l)" -eq 19
          for archive in dist/*.tar.gz; do
            tar -tzf "$archive" | grep '/BUILD-INFO.txt$' > /dev/null
            tar -xOzf "$archive" --wildcards '*/BUILD-INFO.txt' | grep -Fx "Source commit: $SOURCE_SHA"
          done
          git archive --format=tar.gz --prefix="posirc-$version/" \
            -o "dist/posirc-$version-source.tar.gz" "$SOURCE_SHA"
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          test -f "docs/releases/$tag.md"
          if existing=$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha 2>/dev/null); then
            test "$existing" = "$SOURCE_SHA"
          fi
          # Upload as a draft first; only a complete asset set becomes public.
          gh release create "$tag" dist/*.tar.gz dist/SHA256SUMS \
            --target "$SOURCE_SHA" --title "POSIRC $version" \
            --notes-file "docs/releases/$tag.md" --prerelease --draft
          gh release edit "$tag" --draft=false --prerelease --latest=false
